name: Build Xbox 360

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check XDK
        shell: pwsh
        run: |
          if (-not $env:XEDK) {
            Write-Error "XEDK n'est pas défini sur le runner."
          }

          if (-not (Test-Path "$env:XEDK\bin\win32\fxc.exe")) {
            Write-Error "fxc.exe introuvable dans XEDK."
          }

          Write-Host "XEDK = $env:XEDK"

      - name: Build
        shell: pwsh
        run: |
          $msbuild = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"

          if (-not (Test-Path $msbuild)) {
            Write-Error "MSBuild introuvable."
          }

          & $msbuild hiddriver.sln `
            /p:Configuration="Release Retail" `
            /p:Platform="Xbox 360" `
            /m

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: xbox360-build
          path: |
            **/*.xex
            **/*.exe
